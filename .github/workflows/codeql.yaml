name: maven CodeQL analysis, re-usable

on:
  workflow_call:
    inputs:
      java-version:
        description: the java version to use
        required: false
        type: number
        default: 21
    secrets:
      token:
        description: 'github token'
        required: true
      webhook:
        description: 'slack webhook'
        required: true

env:
  TZ: Europe/Oslo

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
    timeout-minutes: 15
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.repository.name }}-${{ github.ref }}
      cancel-in-progress: true
    if: github.event_name != 'pull_request' || github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        language: [ 'java', 'actions', 'javascript', 'go' ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 #v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad #v6.1.0
        with:
          distribution: 'temurin'
          java-version: '${{ inputs.java-version }}'
          overwrite-settings: false

      - name: Cache local Maven repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ github.event.repository.name }}

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}

      - name: Create settings.xml
        uses: s4u/maven-settings-action@894661b3ddae382f1ae8edbeab60987e08cf0788 #v4.0.0
        with:
          repositories: '[{"id": "eresept-parent","name": "github","url": "https://maven.pkg.github.com/navikt/eresept-parent"}]'
          servers: '[{"id": "eresept-parent", "username": "${{ github.actor }}", "password": "${{ secrets.token }}"}]'
          path: maven-settings.xml

      - name: Compile for CodeQL scan
        run: mvn compile -B --no-transfer-progress -DskipTests -Ddetekt.skip=true --settings maven-settings.xml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{matrix.language}}"

      - name: report to slack
        if: always()
        uses: navikt/eresept-actions/slack-notify@main
        with:
          status: "${{ job.status }}"
          username: "codeql ${{ github.event.repository.name }}"
          icon: ":mag:"
          title-success: "CodeQL scan of ${{ github.event.repository.name }} passed"
          title-failure: "CodeQL scan of ${{ github.event.repository.name }} failed"
          title-cancelled: "CodeQL scan of ${{ github.event.repository.name }} was cancelled"
          webhook: ${{ secrets.webhook }}
